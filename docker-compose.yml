services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: [.env.docker]
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      mysql: { condition: service_healthy }
      speech: { condition: service_started }
      tts: { condition: service_started }
    volumes:
      - recordings:/app/uploads
      - salesforce_tokens:/app/.localvoice-private/salesforce
    restart: unless-stopped

  speech:
    build:
      context: .
      dockerfile: Dockerfile.speech
    environment:
      VOICE_SERVICE_TOKEN: ${VOICE_SERVICE_TOKEN}
      VOICE_SERVICE_HOST: 0.0.0.0
      WHISPER_MODEL_SIZE: ${WHISPER_MODEL_SIZE:-tiny}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
      VOSK_MODEL_PATH: /speech/models/vosk-model-small-en-us-0.15
    volumes: [./models:/speech/models]
    expose: ["8001"]
    restart: unless-stopped

  tts:
    build:
      context: .
      dockerfile: Dockerfile.tts
    environment:
      VOICE_SERVICE_TOKEN: ${VOICE_SERVICE_TOKEN}
      VOICE_SERVICE_HOST: 0.0.0.0
      PIPER_VOICE: /tts/models/en_US-lessac-medium.onnx
    volumes: [./models:/tts/models]
    expose: ["8002"]
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: localvoice
      MYSQL_USER: localvoice
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes: [mysql_data:/var/lib/mysql]
    expose: ["3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  mysql_data:
  recordings:
  salesforce_tokens:
