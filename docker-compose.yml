services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    env_file: [.env.docker]
    environment:
      HOST: 0.0.0.0
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      mysql: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
      speech: { condition: service_healthy }
      tts: { condition: service_healthy }
    volumes:
      - recordings:/app/uploads
      - salesforce_tokens:/app/.localvoice-private/salesforce
      - hubspot_tokens:/app/.localvoice-private/hubspot
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    env_file: [.env.docker]
    command: ["node", "--import", "tsx", "scripts/migrate.ts", "--apply"]
    depends_on:
      mysql: { condition: service_healthy }
    restart: "no"

  speech:
    build:
      context: .
      dockerfile: Dockerfile.speech
    env_file: [.env.docker]
    environment:
      VOICE_SERVICE_HOST: 0.0.0.0
    volumes: [./models:/speech/models:ro, speech_cache:/speech/cache]
    expose: ["8001"]
    restart: unless-stopped

  tts:
    build:
      context: .
      dockerfile: Dockerfile.tts
    env_file: [.env.docker]
    environment:
      VOICE_SERVICE_HOST: 0.0.0.0
      PIPER_VOICE: /tts/models/en_US-lessac-medium.onnx
    volumes: [./models:/tts/models:ro]
    expose: ["8002"]
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: localvoice
      MYSQL_USER: localvoice
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes: [mysql_data:/var/lib/mysql]
    expose: ["3306"]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h localhost -u root --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  mysql_data:
  recordings:
  salesforce_tokens:
  hubspot_tokens:
  speech_cache:
